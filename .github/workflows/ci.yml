name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & test (JDK 17 + MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: twiter
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/twiter
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, run unit + integration tests, generate coverage
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker-smoke-test:
    name: Docker image + smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack (app + MySQL)
        run: docker compose up -d --build

      - name: Wait for the API and call it
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/users/getUsers || true)
            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              echo "API is up (HTTP $code)"; exit 0
            fi
            sleep 5
          done
          docker compose logs app
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
